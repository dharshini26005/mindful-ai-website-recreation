<!DOCTYPE html>
<html>
<head>
  <title>Applications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h2 class="mb-4">Internship Applications</h2>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>College</th>
        <th>Department</th>
        <th>Year</th>
        <th>Resume</th>
      </tr>
    </thead>

    <tbody>
      {% for app in applications %}
      <tr>
        <td>{{ app[0] }}</td>
        <td>{{ app[1] }}</td>
        <td>{{ app[2] }}</td>
        <td>{{ app[3] }}</td>
        <td>{{ app[4] }}</td>
        <td>{{ app[5] }}</td>
        <td>{{ app[6] }}</td>
        <td>
          <a href="/uploads/{{ app[7] }}" target="_blank">View Resume</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>

  </table>

</body>
</html>
