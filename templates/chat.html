<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindfulAI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #050b2e, #062a55, #0b4f6c);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    /* ================= CHAT CONTAINER ================= */
    #chatbox {
      width: 420px;
      height: 90vh;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 198, 255, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ================= HEADER ================= */
    #chatbox h2 {
      margin: 0;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* ================= MESSAGES ================= */
    #messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
      font-size: 14.8px;
    }

    .user {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #ffffff;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      box-shadow: 0 0 12px rgba(0, 198, 255, 0.4);
    }

    .bot {
      background: rgba(255, 255, 255, 0.15);
      color: #e6f4ff;
      margin-right: auto;
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(6px);
    }

    /* ================= INPUT AREA ================= */
    .input-area {
      display: flex;
      padding: 14px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 14.5px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    #input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    button {
      margin-left: 10px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 198, 255, 0.7);
    }

  </style>
</head>

<body>

  <div id="chatbox">
    <h2>MindfulAI Assistant</h2>

    <div id="messages"></div>

    <div class="input-area">
      <input id="input" type="text" placeholder="Ask anything about MindfulAI..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
function sendMessage() {
  let msg = document.getElementById("input").value;
  if (!msg.trim()) return;

  addMessage(msg, "user");
  document.getElementById("input").value = "";

  fetch("/chatbot", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg })
  })
  .then(res => res.json())
  .then(data => addMessage(data.reply, "bot"))
  .catch(() => addMessage("Server is not available right now.", "bot"));
}

function addMessage(text, sender) {
  let m = document.getElementById("messages");

  m.innerHTML += `
    <div class="msg ${sender}">
      ${text}
    </div>
  `;

  m.scrollTop = m.scrollHeight;
}
</script>

</body>
</html>
